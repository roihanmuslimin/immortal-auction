name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: node tools/lint/run.mjs
      - name: Test
        run: node --test "tests/**/*.test.mjs"

  build:
    name: Build bundle and size report
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tooling
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build
        run: node tools/build.mjs
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            dist/size-report.json
            package-lock.json
